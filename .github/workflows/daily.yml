name: Épisode quotidien

on:
  schedule:
    # Heure de livraison (UTC) — ajustée automatiquement par `myop setup`
    # 30 5 * * * ≈ 7h30 à Paris en été
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Une seule génération à la fois, sans annuler une publication en cours
concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Installer uv
        run: pipx install uv

      - name: Installer les dépendances Python
        run: uv sync

      - name: Générer et publier l'épisode du jour
        env:
          GIT_COMMITTER_NAME: myop-bot
          GIT_COMMITTER_EMAIL: myop-bot@users.noreply.github.com
          GIT_AUTHOR_NAME: myop-bot
          GIT_AUTHOR_EMAIL: myop-bot@users.noreply.github.com
        run: |
          git config user.name  "myop-bot"
          git config user.email "myop-bot@users.noreply.github.com"
          uv run myop generate --publish
