name: Épisodes du jour

on:
  schedule:
    # Vérification horaire : MYOP génère les émissions dues à cette heure-ci
    # (delivery_hour de chaque show, heure de Paris). Coût négligeable (~1 min/h).
    - cron: "26 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Régénérer les épisodes du jour même sans nouvel article"
        type: boolean
        default: false
      show:
        description: "Une seule émission (id), vide = toutes"
        default: ""

permissions:
  contents: write

# Une seule génération à la fois, sans annuler une publication en cours
concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Installer uv
        run: pipx install uv

      - name: Installer les dépendances Python
        run: uv sync

      - name: Générer et publier les épisodes
        env:
          # Rédaction IA via OpenRouter (facultatif : repli déterministe sinon)
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          git config user.name  "myop-bot"
          git config user.email "myop-bot@users.noreply.github.com"
          ARGS="--publish"
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --fresh"; fi
          if [ -n "${{ inputs.show }}" ]; then
            ARGS="$ARGS --show ${{ inputs.show }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="$ARGS --all"  # déclenchement manuel : toutes les émissions
          else
            ARGS="$ARGS --due"  # cron horaire : seulement les émissions de l'heure
          fi
          uv run myop generate $ARGS
