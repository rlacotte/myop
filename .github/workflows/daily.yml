name: Épisodes du jour

on:
  schedule:
    # Planification générée par `myop setup` / « Publier la config » depuis les
    # heures de livraison. Deux crons par heure de livraison (UTC+1 l'hiver,
    # UTC+2 l'été) : `myop generate --due` raisonne en heure de Paris et ignore
    # le déclenchement hors saison.
    - cron: "30 5 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Régénérer les épisodes du jour même sans nouvel article"
        type: boolean
        default: false
      show:
        description: "Une seule émission (id), vide = toutes"
        default: ""

permissions:
  contents: write
  issues: write  # ouvre une issue si la génération casse

# Une seule génération à la fois, sans annuler une publication en cours
concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Installer uv
        run: pipx install uv

      - name: Installer les dépendances Python
        run: uv sync

      # Miroir Vercel : sans le secret, l'étape est sautée et la publication
      # GitHub Pages — qui reste l'adresse officielle du flux — suffit.
      - name: Installer la CLI Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: npm install --global vercel@latest

      - name: Générer et publier les épisodes
        env:
          # Rédaction IA via OpenRouter (facultatif : repli déterministe sinon)
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Miroir Vercel (facultatif)
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          git config user.name  "myop-bot"
          git config user.email "myop-bot@users.noreply.github.com"
          ARGS="--publish"
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --fresh"; fi
          if [ -n "${{ inputs.show }}" ]; then
            ARGS="$ARGS --show ${{ inputs.show }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="$ARGS --all"  # déclenchement manuel : toutes les émissions
          else
            ARGS="$ARGS --due"  # cron : seulement les émissions dues à cette heure
          fi
          uv run myop generate $ARGS

      # Sans cela, une panne se remarque seulement à l'épisode manquant.
      - name: Signaler l'échec
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create myop-panne --color B60205 \
            --description "Génération quotidienne en échec" 2>/dev/null || true
          NUMBER=$(gh issue list --label myop-panne --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body "Nouvel échec : $RUN_URL"
          else
            gh issue create --label myop-panne \
              --title "MYOP : la génération quotidienne est en échec" \
              --body "$(printf 'La génération a échoué.\n\nJournal : %s\n\nDiagnostic local : `uv run myop doctor`.\nCette issue sera commentée aux échecs suivants — referme-la une fois le problème réglé.' "$RUN_URL")"
          fi
