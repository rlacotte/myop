{% extends "base.html" %}
{% block title %}Réglages{% endblock %}
{% block page %}settings{% endblock %}
{% block content %}
<h1>Réglages — <span id="show-title">{{ show.title }}</span></h1>

<form id="settings-form" class="card">
  <h2>Identité de l'émission</h2>
  <div class="grid2">
    <label>Titre
      <input name="title" value="{{ show.title }}" required maxlength="80">
    </label>
    <label>Heure de livraison (Paris)
      <input name="delivery_hour" type="time" value="{{ show.delivery_hour }}">
    </label>
    <label>Statut
      <label class="checkbox" style="margin-top:26px">
        <input type="checkbox" name="enabled" {% if show.enabled %}checked{% endif %}>
        Émission activée (générée chaque jour)
      </label>
    </label>
    <label>Météo (ville, vide = désactivé)
      <input name="weather_city" value="{{ show.weather_city or '' }}" placeholder="Paris">
    </label>
  </div>
  <label>Description
    <textarea name="description" rows="2" maxlength="300">{{ show.description }}</textarea>
  </label>
  <label class="checkbox">
    <input type="checkbox" name="ephemeris" {% if show.ephemeris %}checked{% endif %}>
    Éphéméride dans l'intro (jours fériés, pleine lune…)
  </label>

  <h2>Voix &amp; rythme</h2>
  <div class="grid2">
    <label>Voix principale
      <div class="row">
        <select name="voice" id="voice-select">
          <option value="{{ show.voice }}">{{ show.voice }}</option>
        </select>
        <button type="button" id="voice-preview" class="btn ghost">▶</button>
      </div>
    </label>
    <label>2ᵉ voix (dialogue à deux, vide = désactivé)
      <div class="row">
        <select name="voice_co" id="voice-co-select">
          <option value="">— aucune —</option>
          {% if show.voice_co %}<option value="{{ show.voice_co }}" selected>{{ show.voice_co }}</option>{% endif %}
        </select>
        <button type="button" id="voice-co-preview" class="btn ghost">▶</button>
      </div>
    </label>
    <label>Débit intro/outro
      <input name="intro_rate" value="{{ show.intro_rate }}" placeholder="-8%">
    </label>
    <label>Débit brèves
      <input name="brief_rate" value="{{ show.brief_rate }}" placeholder="+4%">
    </label>
  </div>

  <h2>Contenu de l'épisode</h2>
  <div class="grid2">
    <label>Nombre de titres (flash)
      <input name="num_headlines" type="number" min="1" max="30" value="{{ show.num_headlines }}">
    </label>
    <label>Nombre de brèves détaillées
      <input name="num_briefs" type="number" min="0" max="10" value="{{ show.num_briefs }}">
    </label>
    <label>Résumé max (caractères)
      <input name="max_brief_chars" type="number" min="100" max="2000" step="50" value="{{ show.max_brief_chars }}">
    </label>
    <label>Max d'articles par source
      <input name="max_per_source" type="number" min="1" max="10" value="{{ show.max_per_source }}">
    </label>
  </div>

  <h2>Rédaction IA (OpenRouter)</h2>
  <div class="grid2">
    <label>Modèle
      <input name="ai_model" value="{{ config.ai.model }}" placeholder="google/gemini-3.6-flash">
    </label>
    <label class="checkbox" style="margin-top:26px">
      <input type="checkbox" name="ai_enabled" {% if config.ai.enabled %}checked{% endif %}>
      Script rédigé par l'IA <span class="hint">(repli auto sinon)</span>
    </label>
  </div>
  <label>Persona / ton de l'émission
    <textarea name="ai_persona" rows="2" maxlength="400">{{ config.ai.persona }}</textarea>
  </label>
  <label>Exemples de ton
    <textarea name="ai_tone_examples" rows="6" placeholder="Colle un ou plusieurs extraits dont tu aimes le style — une chronique, un billet, ta propre écriture.
Sépare les exemples par une ligne contenant ---">{{ config.ai.tone_examples | join('\n---\n') }}</textarea>
    <small>Montrer un ton marche mieux que le décrire. Le style est imité,
      jamais le contenu. 5 exemples max, 1 500 signes chacun.</small>
  </label>
  <label>Consigne système libre (avancé — vide = persona)
    <textarea name="ai_system_prompt" rows="2" maxlength="1000">{{ config.ai.system_prompt or '' }}</textarea>
  </label>

  <h2>Audio</h2>
  <label class="checkbox">
    <input type="checkbox" name="jingle" {% if config.audio.jingle %}checked{% endif %}>
    Jingle d'intro/outro et transitions
  </label>
  <label class="checkbox">
    <input type="checkbox" name="chapters" {% if config.audio.chapters %}checked{% endif %}>
    Chapitrage des épisodes (navigation dans le lecteur)
  </label>

  <h2>Podcast (global)</h2>
  <div class="grid2">
    <label>Auteur
      <input name="author" value="{{ config.author }}" maxlength="60">
    </label>
    <label>Email (contact flux iTunes)
      <input name="email" type="email" value="{{ config.email }}">
    </label>
  </div>
  <label class="checkbox">
    <input type="checkbox" name="skip_if_empty" {% if config.skip_if_empty %}checked{% endif %}>
    Pas d'épisode s'il n'y a aucun nouvel article
  </label>
  <label>Épisodes conservés en ligne (0 = tous)
    <input name="keep_episodes" type="number" min="0" max="1000"
           value="{{ config.publishing.keep_episodes }}">
    <small>Au-delà, les plus anciens sortent du flux et du site — ~2 Mo chacun,
      pour une limite GitHub Pages de 1 Go.</small>
  </label>

  <div class="actions">
    <button type="submit" class="btn primary">💾 Enregistrer</button>
    <button type="button" id="btn-delete-show" class="btn danger">🗑 Supprimer cette émission</button>
  </div>
</form>
{% endblock %}
